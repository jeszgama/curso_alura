<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listas</title>
  </head>
  <body>
    <h1>Listas:</h1>
    <hr />
    <p>Lista ordenada</p>
    <ol type="1" start="5">
      <!-- Lista ordenada que tem o tipo numérico '1' 'A' 'a' e começa o contador com o número 5 -->
      <li>colocar os ovos na batedeira</li>
      <li>colocar chocolate</li>
      <li>colocar a farinha</li>
      <li>colocar o açucar</li>
      <li>colocar o leite</li>
    </ol>
    <p>Lista desordenada</p>
    <ul type="square">
      <!-- Lista desordenada com os tipos 'disc' 'circle' 'square' -->
      <li>comprar café</li>
      <li>comprar pão</li>
      <li>
        comprar produtos de limpeza
        <ul>
          <li>sabão</li>
          <li>detergente</li>
          <li>amaciante</li>
        </ul>
      </li>
    </ul>
  </body>
</html>
